# k3s registry mirror configuration.
# Tells k3s to resolve unregistry.hallm.local via the unregistry DaemonSet's
# host-network port on the node, bypassing Traefik (which only exposes
# unregistry over HTTPS and would 404 plain-HTTP requests) and avoiding the
# Cerberus CA trust dance for in-node pulls.
mirrors:
  "unregistry.hallm.local":
    endpoint:
      - "http://127.0.0.1:5000"
