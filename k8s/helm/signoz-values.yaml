# SigNoz Helm chart values for the local k3d cluster.
# Applied via `helm upgrade --install signoz signoz/signoz -n signoz -f k8s/helm/signoz-values.yaml`
# from `hallm cluster setup` (delegating to `hallm signoz bootstrap`).

global:
  storageClass: local-path

# Frontend exposed via a sibling Ingress (k8s/signoz-ingress.yaml), not Helm.
frontend:
  service:
    type: ClusterIP
  ingress:
    enabled: false

# OTEL collector — Service ClusterIP so app code reaches it at
# signoz-otel-collector.signoz.svc.cluster.local:4317
otelCollector:
  service:
    type: ClusterIP
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318

# ClickHouse storage tuned for a dev cluster.
clickhouse:
  enabled: true
  cloud: false
  persistence:
    enabled: true
    size: 30Gi
  zookeeper:
    persistence:
      enabled: true
      size: 5Gi

queryService:
  service:
    type: ClusterIP

# k8s-infra agents (cluster receiver + node DaemonSet) live in a separate
# Helm release because signoz/signoz >= 0.55 dropped them as a subchart.
# See k8s/helm/k8s-infra-values.yaml — installed by `hallm signoz bootstrap`.
