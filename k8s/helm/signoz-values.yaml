# SigNoz Helm chart values for the local k3d cluster.
# Applied via `helm upgrade --install signoz signoz/signoz -n signoz -f k8s/helm/signoz-values.yaml`
# from `hallm cluster setup` (delegating to `hallm signoz bootstrap`).

global:
  storageClass: local-path

# Frontend exposed via a sibling Ingress (k8s/signoz-ingress.yaml), not Helm.
frontend:
  service:
    type: ClusterIP
  ingress:
    enabled: false

# OTEL collector — Service ClusterIP so app code reaches it at
# signoz-otel-collector.signoz.svc.cluster.local:4317
otelCollector:
  service:
    type: ClusterIP
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318

# ClickHouse storage tuned for a dev cluster.
clickhouse:
  enabled: true
  cloud: false
  persistence:
    enabled: true
    size: 30Gi
  zookeeper:
    persistence:
      enabled: true
      size: 5Gi

queryService:
  service:
    type: ClusterIP

# k8s-infra subchart: cluster receiver (Deployment) + node agent (DaemonSet).
# Together these give SigNoz visibility into:
#   - cluster events, namespaces, deployments, pods (k8s_cluster receiver)
#   - per-node CPU/mem/disk/net + per-pod stats (kubeletstats + hostmetrics)
#   - per-pod container logs tailed from /var/log/pods (filelog receiver)
#   - k8s metadata enrichment on every signal flowing through the agent
#     (k8sattributes processor) — `app` label is promoted to `service.name`
#     so each Deployment surfaces as its own service in the SigNoz UI.
k8s-infra:
  enabled: true
  presets:
    otlpExporter:
      enabled: true
    loggingExporter:
      enabled: false
    kubernetesAttributes:
      enabled: true
      extractLabels:
        - tag_name: service.name
          key: app
          from: pod
        - tag_name: service.version
          key: app.kubernetes.io/version
          from: pod
    kubeletMetrics:
      enabled: true
    hostMetrics:
      enabled: true
    clusterMetrics:
      enabled: true
    kubernetesEvents:
      enabled: true
    logsCollection:
      enabled: true
      startAt: end
      includeFilePath: true
      includeFileName: false
      blacklist:
        enabled: true
        signozLogs: true
        namespaces:
          - kube-system
        pods: []
        containers: []
        additionalExclude: []
      operators:
        - id: container-parser
          type: container
  otelAgent:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 300Mi
  otelDeployment:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 300Mi
