apiVersion: apps/v1
kind: Deployment
metadata:
  name: wakapi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wakapi
  template:
    metadata:
      labels:
        app: wakapi
    spec:
      enableServiceLinks: false
      containers:
        - name: wakapi
          image: ghcr.io/muety/wakapi:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WAKAPI_DB_TYPE
              value: postgres
            - name: WAKAPI_DB_HOST
              value: postgres.default.svc.cluster.local
            - name: WAKAPI_DB_PORT
              value: "5432"
            - name: WAKAPI_DB_SSL
              value: "false"
            - name: WAKAPI_PUBLIC_URL
              value: https://wakapi.hallm.local
            - name: WAKAPI_ALLOW_SIGNUP
              value: "false"
            - name: WAKAPI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: WAKAPI_DB_NAME
            - name: WAKAPI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: WAKAPI_DB_USER
            - name: WAKAPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: WAKAPI_DB_PASSWORD
            - name: WAKAPI_PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: WAKAPI_PASSWORD_SALT
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: wakapi
  namespace: default
spec:
  selector:
    app: wakapi
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wakapi
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [wakapi.hallm.local]
      secretName: wakapi-tls
  rules:
    - host: wakapi.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wakapi
                port:
                  number: 80
