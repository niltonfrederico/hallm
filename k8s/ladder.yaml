apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladder
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ladder
  template:
    metadata:
      labels:
        app: ladder
    spec:
      containers:
        - name: ladder
          image: ghcr.io/everywall/ladder:latest
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ladder
  namespace: default
spec:
  selector:
    app: ladder
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ladder
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [ladder.hallm.local]
      secretName: ladder-tls
  rules:
    - host: ladder.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ladder
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ladder-tailnet
  namespace: default
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: ladder
      port:
        number: 80
  tls:
    - hosts: [ladder]
