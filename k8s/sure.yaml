apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure-storage
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sure
      component: web
  template:
    metadata:
      labels:
        app: sure
        component: web
    spec:
      containers:
        - name: sure
          image: ghcr.io/we-promise/sure:stable
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: RAILS_ASSUME_SSL
              value: "true"
            - name: PORT
              value: "3000"
            - name: BINDING
              value: "0.0.0.0"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_SECRET_KEY_BASE
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: DATABASE_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_VALKEY_URL
            - name: WEBAUTHN_RP_ID
              value: "sure.hallm.local"
            - name: WEBAUTHN_ALLOWED_ORIGINS
              value: "https://sure.hallm.local"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 12
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sure
      component: worker
  template:
    metadata:
      labels:
        app: sure
        component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/we-promise/sure:stable
          command: ["bundle", "exec", "sidekiq"]
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: RAILS_ASSUME_SSL
              value: "true"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_SECRET_KEY_BASE
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: DATABASE_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_DB_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: SURE_VALKEY_URL
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage

---
apiVersion: v1
kind: Service
metadata:
  name: sure
  namespace: default
spec:
  selector:
    app: sure
    component: web
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [sure.hallm.local]
      secretName: sure-tls
  rules:
    - host: sure.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sure
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure-tailnet
  namespace: default
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: sure
      port:
        number: 80
  tls:
    - hosts: [sure]
