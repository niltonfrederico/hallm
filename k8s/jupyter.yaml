apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-claude
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      enableServiceLinks: false
      containers:
        - name: jupyter
          image: unregistry.hallm.local/hallm/jupyter:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -lc
            - |
              exec start-notebook.py \
                --IdentityProvider.token="${JUPYTER_TOKEN}" \
                --ServerApp.disable_check_xsrf=True \
                --ServerApp.allow_origin='*' \
                --ServerApp.base_url=/ \
                --ServerApp.root_dir=/home/jovyan/work
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: JUPYTER_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: ANTHROPIC_API_KEY
            - name: NBI_CLAUDE_MODE_POLICY
              value: force-on
            - name: NBI_CLAUDE_CODE_TOOLS_POLICY
              value: force-on
            - name: NBI_CLAUDE_JUPYTER_UI_TOOLS_POLICY
              value: force-on
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
            - name: claude
              mountPath: /home/jovyan/.claude
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jupyter-data
        - name: claude
          persistentVolumeClaim:
            claimName: jupyter-claude

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: default
spec:
  selector:
    app: jupyter
  ports:
    - port: 80
      targetPort: 8888

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hallm.local/dashboard: "true"
    hallm.local/title: "Jupyter"
    hallm.local/icon: "jupyter"
    hallm.local/category: "data"
    hallm.local/description: "Interactive notebooks"
spec:
  tls:
    - hosts: [jupyter.hallm.local]
      secretName: jupyter-tls
  rules:
    - host: jupyter.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyter
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-tailnet
  namespace: default
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jupyter
      port:
        number: 80
  tls:
    - hosts: [jupyter]
