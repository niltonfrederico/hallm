apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      enableServiceLinks: false
      containers:
        - name: jupyter
          image: quay.io/jupyter/base-notebook:latest
          imagePullPolicy: IfNotPresent
          args:
            - start-notebook.py
            - --ServerApp.token=
            - --ServerApp.password=
            - --ServerApp.disable_check_xsrf=True
            - --ServerApp.allow_origin=*
            - --ServerApp.base_url=/
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/jovyan
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jupyter-data

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: default
spec:
  selector:
    app: jupyter
  ports:
    - port: 80
      targetPort: 8888

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [jupyter.hallm.local]
      secretName: jupyter-tls
  rules:
    - host: jupyter.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyter
                port:
                  number: 80
