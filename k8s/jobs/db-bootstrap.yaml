---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  namespace: default
  labels:
    app: db-bootstrap
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: db-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache gettext >/dev/null

              # 1. Map standard psql connection variables
              export PGUSER="$POSTGRES_USER"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              export PGDATABASE="$POSTGRES_DB"

              # 2. Alias shared passwords (since they reuse POSTGRES_PASSWORD)
              export HALLM_DB_PASSWORD="$POSTGRES_PASSWORD"
              export SIGNOZ_MONITOR_PASSWORD="$POSTGRES_PASSWORD"

              # 3. Dynamically build the VARS list for envsubst
              # Grabs any env var where the key contains "_DB_" and formats it as $VAR_NAME
              DB_VARS=$(env | awk -F= '$1 ~ /_DB_/ {printf "$%s ", $1}')

              # Combine the dynamic DB vars with the explicit Signoz vars
              VARS="${DB_VARS}\$SIGNOZ_MONITOR_USER \$SIGNOZ_MONITOR_PASSWORD"

              for f in /bootstrap/*.sql; do
                echo "==> Running $f"
                envsubst "$VARS" < "$f" | psql --set=ON_ERROR_STOP=1 --no-psqlrc
              done
              echo "==> Bootstrap complete."
          envFrom:
            - secretRef:
                name: hallm-env
          env:
            # --- psql connection info ---
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
          volumeMounts:
            - name: bootstrap-sql
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap-sql
          configMap:
            name: hallm-bootstrap-sql
