apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__server__DOMAIN
              value: git.hallm.local
            - name: GITEA__server__ROOT_URL
              value: https://git.hallm.local/
            - name: GITEA__server__SSH_DOMAIN
              value: git.hallm.local
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: postgres:5432
            - name: GITEA__database__NAME
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: GITEA_DB_NAME
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: GITEA_DB_USER
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: GITEA_DB_PASSWORD
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: GITEA_SECRET_KEY
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hallm-env
                  key: GITEA_INTERNAL_TOKEN
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: GITEA__mirror__DEFAULT_INTERVAL
              value: "1h"
            - name: GITEA__cron_repo_health_check__SCHEDULE
              value: "@every 24h"
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          resources:
            requests:
              cpu: "50m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data

---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: default
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: ssh
      port: 2222
      targetPort: 22

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cerberus-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [git.hallm.local]
      secretName: gitea-tls
  rules:
    - host: git.hallm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-tailnet
  namespace: default
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gitea
      port:
        number: 80
  tls:
    - hosts: [gitea]
