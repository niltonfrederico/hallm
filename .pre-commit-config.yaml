default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Unified diffs encode a blank context line as a single space, so
      # stripping trailing whitespace silently corrupts every .patch under
      # docker/ and makes `git apply` fail during the image build.
      - id: trailing-whitespace
        exclude: \.(patch|diff)$
      - id: end-of-file-fixer
        exclude: \.(patch|diff)$
      - id: check-yaml
        exclude: ^k8s/
      - id: check-yaml
        name: check-yaml (k8s multi-doc)
        files: ^k8s/
        args: [ --allow-multiple-documents ]
      - id: check-toml
      - id: check-added-large-files
        name: check-added-large-files (non-image)
        exclude_types: [image]
        exclude: (^|/)(package-lock\.json|uv\.lock|poetry\.lock|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock)$
      - id: check-added-large-files
        name: check-added-large-files (image, 1MB)
        types: [image]
        args: [ --maxkb=1024 ]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
        name: markdownlint (ai config)
        files: ^\.github/.*\.md$

      - id: markdownlint-cli2
        name: markdownlint (project docs)
        files: \.md$
        exclude: ^(\.claude|\.github)/

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [ python ]
        pass_filenames: false

      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: system
        stages: [ commit-msg ]
